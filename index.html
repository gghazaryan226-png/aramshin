    <style>
        /* Custom styles for smooth scrolling and general look */
        html {
            scroll-behavior: smooth;
            font-family: 'Inter', sans-serif;
        }

            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05), 0 2px 4px -2px rgba(0, 0, 0, 0.05);
        }

        /* Partner Logo Scrolling Animation */
        .logo-slide {
            display: flex;
            animation: scroll-logos 30s linear infinite; /* Adjust time for speed */
        }
        .logo-track {
            display: flex;
            width: max-content; /* Critical for scrolling overflow */
        }
        .logo-item {
            padding: 0 2rem;
            flex-shrink: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            /* Ensure logos are hidden off screen on mobile to prevent layout shifts */
            min-width: 150px; 
        }
        @keyframes scroll-logos {
            from { transform: translateX(0); }
            to { transform: translateX(-50%); } /* Scrolls one full set of logos */
        }
        /* Pause animation on hover */
        .logo-track:hover .logo-slide {
            animation-play-state: paused;
        }
    </style>

        const defaultLang = 'AM';
        // 1. Check localStorage first, otherwise use the default Armenian ('AM')
        let currentLang = localStorage.getItem('userLang') || defaultLang;

        /**
         * Updates all data-localize elements with the text for the current language.
         */
        function updateContent() {
            const t = translations[currentLang];
            document.querySelectorAll('[data-localize]').forEach(element => {
                const key = element.getAttribute('data-localize');
                if (t[key]) {
                    // Handle input placeholders
                    if (element.tagName === 'INPUT' || element.tagName === 'TEXTAREA') {
                        element.placeholder = t[key];
                    } else {
                        element.textContent = t[key];
                    }
                }
            });

            // Update active language button text
            const langName = document.getElementById('current-lang-name');
            if (langName) {
                langName.textContent = t.lang_name;
            }
        }

        /**
         * Sets the application language and updates the content.
         * @param {string} langCode - The two-letter language code (e.g., 'AM', 'RU', 'EN').
         */
        function setLang(langCode) {
            if (translations[langCode]) {
                currentLang = langCode;
                // 2. Save the selected language to localStorage
                localStorage.setItem('userLang', langCode);
                
                document.documentElement.lang = langCode.toLowerCase();
                updateContent();
                // Optionally close the dropdown if open
                document.getElementById('lang-dropdown').classList.add('hidden');
            }
        }

        /**
         * Toggles the mobile navigation menu.
         */
        function toggleMobileMenu() {
            const menu = document.getElementById('mobile-menu');
            menu.classList.toggle('hidden');
        }

        /**
         * Toggles the language dropdown menu.
         */
        function toggleLangDropdown() {
            const dropdown = document.getElementById('lang-dropdown');
            dropdown.classList.toggle('hidden');
        }

        // Initialize content on load
        window.onload = () => {
            // This calls updateContent() using the language loaded from localStorage or the default 'AM'
            updateContent(); 
            // Attach event listeners to language links
            document.querySelectorAll('.lang-link').forEach(link => {
                link.addEventListener('click', (e) => {
                    e.preventDefault();
                    setLang(e.target.getAttribute('data-lang'));
                });
            });
            // Attach listener for mobile menu button
            document.getElementById('mobile-menu-button').addEventListener('click', toggleMobileMenu);
            // Attach listener for language dropdown button
            document.getElementById('lang-toggle-button').addEventListener('click', toggleLangDropdown);
        };
    </script>
